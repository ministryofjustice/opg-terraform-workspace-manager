name: "[PR & PUSH] Tag & Release"

on:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']

permissions:
  contents: write

jobs:
  tag_and_release:
    name: "Tag and release"
    runs-on: ubuntu-latest
    env:
      prerelease: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: "Generate semver tag"
        id: semver
        uses: ministryofjustice/opg-github-actions/actions/semver@4f345be3f706950d1fdc05bc86383967a149bd99 # v4.3.4
        with:
          prerelease: ${{ env.prerelease }}
          create_release: "false"
      - name: "Checkout to created semver tag"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ steps.semver.outputs.tag }}
      - name: Create release and artifacts
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker compose run \
            --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v $PWD:/go/src/github.com/ministryofjustice/opg-terraform-workspace-manager \
            -w /go/src/github.com/ministryofjustice/opg-terraform-workspace-manager \
            -e GITHUB_TOKEN \
            goreleaser \
              release --clean

  end:
    name: 'End of workflow'
    runs-on: 'ubuntu-latest'
    needs: [tag_and_release]
    steps:
      - id: end
        name: End
        run: |
          echo "End"
